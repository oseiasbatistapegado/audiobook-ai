[project]
name = "narrative-compiler-py"
version = "0.1.0"
description = "PDF → Ollama → Fish Speech in-process → M4B audiobook CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.13.0",
    # fish-speech / transformers<=4.57 need hub <1; uv run re-syncs from lock.
    "huggingface_hub>=0.34.0,<1.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
tts-fish = [
    # Spike: fish-speech pins torch==2.8 (no cp314). On 3.14 use current wheels.
    # torchaudio lags torch on PyPI (2.11 with torch 2.13 as of 2026-07).
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "numpy>=1.26.0",
    "loguru>=0.6.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "tiktoken>=0.8.0",
    "ormsgpack>=1.5.0",
]
# Isolated Voice Design spike — NOT on the audiobook hot path.
# Install (same --no-deps pattern as fish-speech; full parler-tts resolver
# pulls ancient numba via descript-audiotools and breaks on Python ≥3.10):
#   uv sync --extra voice-parler --extra tts-fish
#   uv pip install --no-deps "parler-tts @ git+https://github.com/huggingface/parler-tts.git"
#   # fish-speech already provides descript-audio-codec / DAC for Parler decode
voice-parler = [
    "torch>=2.13.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",
]

[project.scripts]
audiobook-ai = "audiobook_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
