[project]
name = "narrative-compiler-py"
version = "0.1.0"
description = "PDF → llama-server → Parler Voice Design → Qwen3-TTS → M4B audiobook CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.13.0",
    # transformers 4.57 (qwen-tts) needs hub <1; uv run re-syncs from lock.
    "huggingface_hub>=0.34.0,<1.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
tts-qwen = [
    # Install ROCm/CUDA torch separately first (uv sync torch wheels can overwrite ROCm).
    # Example ROCm 6.4: uv pip install torch==2.9.1+rocm6.4 torchaudio==2.9.1+rocm6.4
    #   --index-url https://download.pytorch.org/whl/rocm6.4
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "accelerate==1.12.0",
    "transformers==4.57.3",
    "librosa>=0.10.0",
    "onnxruntime>=1.17.0",
    "qwen-tts==0.1.1",
]
# Voice Design (Parler-TTS pt-BR) — self-contained (DAC pinned; no fish-speech).
# Install:
#   uv sync --extra voice-parler --extra tts-qwen
#   pip install "parler-tts==0.2.3"  (done by bootstrap script, not uv)
# NOTE: transformers==4.46.1 is pinned in scripts/bootstrap_parler_venv.sh
# (cannot coexist with tts-qwen transformers==4.57.3 in uv lock resolution).
# parler-tts is NOT listed here — installed exclusively via bootstrap script.
voice-parler = [
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",
    # DAC_PACKAGE / DAC_VERSION — Parler decode without fish-speech.
    "descript-audio-codec==1.0.0",
]
# Speaker resolution v2 — optional embedding-based alias resolution.
# Install:
#   uv sync --extra speaker-resolution
#   uv pip install sentence-transformers
speaker-resolution = [
    "sentence-transformers>=4.0.0",
]

[project.scripts]
audiobook-ai = "audiobook_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
